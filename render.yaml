services:
  - type: web
    name: nutriserve-api
    runtime: python
    repo: https://github.com/07dhanush7/NutriServe
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: cd backend && gunicorn wsgi:app --bind 0.0.0.0:$PORT
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: AUTO_CREATE_TABLES
        value: "1"
      - key: JWT_ACCESS_TOKEN_MINUTES
        value: "120"
      - key: JWT_REFRESH_TOKEN_DAYS
        value: "30"
      - key: LOG_LEVEL
        value: INFO
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
