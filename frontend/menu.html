<!DOCTYPE html>

<body>

<nav class="navbar">
    <div class="logo">
        <span class="logo-n">N</span>utri<span class="logo-s">Serve</span>
    </div>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>

        <li><a href="cart.html">Cart (<span id="cartCount">0</span>)</a></li>

<section class="category-section">

    <div class="cards">
        <!-- Elders -->
        <div class="card" onclick="location.href='category.html?cat=elders'">
            <img src="static/images/elders.jpg" class="card-img">

                <h2>Elders</h2>

        <div class="card" onclick="location.href='category.html?cat=gym'">

            </div>
        </div>

        <!-- Kids -->
        <div class="card" onclick="location.href='category.html?cat=kids'">
            <img src="static/images/kids.jpg" class="card-img">
            <div class="overlay purple">
                <h2>Kids</h2>
