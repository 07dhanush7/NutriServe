<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Category - NutriServe</title>
    <link rel="stylesheet" href="static/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
<body>

<nav class="navbar">
    <div class="logo">
        <span class="logo-n">N</span>utri<span class="logo-s">Serve</span>
    </div>
    <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="menu.html">Menu</a></li>
        <li><a href="cart.html">Cart (<span id="cartCount">0</span>)</a></li>
        <li><a href="index.html#contact">Contact</a></li>
    </ul>
    <div class="nav-right" id="navRight"></div>
</nav>

<section class="menu-page">
    <div class="menu-header">
        <a href="menu.html" class="back"><- Back to Categories</a>
        <a href="cart.html" class="cart">Cart</a>
    </div>

    <h1 id="catTitle">Loading...</h1>
    <p id="catDesc">...</p>

    <div class="food-grid" id="foodGrid">
        <!-- Rendered by JS -->
    </div>
</section>

<!-- MODAL -->
<div id="scheduleModal" class="modal">
    <div class="modal-content">
        <h2>Select Day & Time</h2>
        <form onsubmit="addToCart(event)">
            <input type="hidden" id="foodName">
            <input type="hidden" id="foodPrice">
            <input type="hidden" id="foodImage">

            <label>Day:</label>
            <select id="daySelect" required>
                <option>Monday</option>
                <option>Tuesday</option>
                <option>Wednesday</option>
                <option>Thursday</option>
                <option>Friday</option>
                <option>Saturday</option>
                <option>Sunday</option>
            </select>

            <label>Time:</label>
            <input type="time" id="timeSelect" required>

            <div class="modal-buttons">
                <button type="submit" class="confirm-btn">Confirm</button>
                <button type="button" onclick="closeModal()">Cancel</button>
            </div>
        </form>
    </div>
</div>

<script src="static/js/script.js"></script>
</body>
</html>
